---
name: helm-ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "charts/meta-monitoring/**"

permissions:
  contents: read

env:
  CT_CONFIGFILE: charts/meta-monitoring/ct.yaml

jobs:
  call-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Lint Yaml
        run: make helm-lint
