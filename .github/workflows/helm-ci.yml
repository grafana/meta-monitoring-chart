---
name: helm-ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "charts/meta-monitoring/**"

permissions:
  contents: read

env:
  CT_CONFIGFILE: charts/meta-monitoring/ct.yaml

jobs:
  call-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Lint Yaml
        run: make helm-lint
