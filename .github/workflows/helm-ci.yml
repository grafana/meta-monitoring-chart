---
name: helm-ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "charts/meta-monitoring/**"

permissions:
  contents: read

env:
  CT_CONFIGFILE: charts/meta-monitoring/ct.yaml

jobs:
  call-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Lint Yaml
        run: make helm-lint
